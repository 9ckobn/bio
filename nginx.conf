server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # Static assets caching (Astro bundles in _astro have content hashes)
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static media/assets
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|mp4|webm|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Route resolving & 404 fallback
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    error_page 404 /404.html;
}
