services:
  dev:
    build:
      context: .
      target: dev
    container_name: bio-site-dev
    ports:
      - "4321:4321"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.astro
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:8000
      # Enables inotify/polling sync for macOS Docker mounts & newly added assets (images, videos, etc.)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bio-site-backend-dev
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
